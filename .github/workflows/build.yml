name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Gradle Directly
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        # البحث عن أي ملف build.gradle لمعرفة مكان المشروع وبنائه
        PROJECT_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # إذا لم يكن gradlew موجوداً، سنستخدم gradle العام أو ننشئه
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        if-no-files-found: error
