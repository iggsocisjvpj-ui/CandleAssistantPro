name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK and Force Print Errors
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        PROJECT_DIR=$(find . -name "build.gradle" -not -path "*/.*" -exec dirname {} \; | head -n 1)
        echo "Project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        
        # تنفيذ البناء وتخزين المخرجات في ملف لمعرفة سبب الفشل بالتحديد
        ./gradlew assembleDebug --no-daemon > build_output.log 2>&1 || {
          echo "=== BUILD FAILED. PRINTING LAST 50 LINES OF LOGS ==="
          tail -n 50 build_output.log
          exit 1
        }

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        if-no-files-found: error
