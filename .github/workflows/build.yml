name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build and Capture Logs
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        PROJECT_DIR=$(find . -name "build.gradle" -not -path "*/.*" -exec dirname {} \; | head -n 1)
        echo "Project directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        
        # تشغيل البناء وحفظ المخرجات في ملف نصي
        ./gradlew assembleDebug --no-daemon > ../build_logs.txt 2>&1 || {
          echo "Build failed. Uploading logs..."
          exit 1
        }

    - name: Upload Build Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build_logs.txt

    - name: Upload APK on Success
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        if-no-files-found: ignore
