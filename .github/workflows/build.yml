name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and Build APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        # البحث عن مكان وجود gradlew وتنفيده تلقائياً
        if [ -f "CandleAssistant/gradlew" ]; then
          cd CandleAssistant
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        elif [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        else
          echo "Gradle wrapper not found, searching..."
          find . -name "gradlew"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        if-no-files-found: error
