name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/cirrusci/android-sdk:34

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Debug APK
      run: |
        cd CandleAssistant
        gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: CandleAssistant/app/build/outputs/apk/debug/app-debug.apk
