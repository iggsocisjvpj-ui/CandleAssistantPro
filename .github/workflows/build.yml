name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Wrapper and Build APK
      run: |
        # البحث التلقائي عن مكان المشروع بغض النظر عن الأسماء
        PROJECT_DIR=$(find . -name "build.gradle" -not -path "*/.*" -exec dirname {} \; | head -n 1)
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # إذا كان ملف gradlew غير موجود، سيقوم النظام بإنشائه فوراً لمنع الخطأ
        if [ ! -f "gradlew" ]; then
          echo "gradlew is missing, generating it now..."
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        if-no-files-found: error
