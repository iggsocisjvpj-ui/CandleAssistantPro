name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Error Capture
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        # طباعة مسارات المستودع للتأكد من مكان وجود المشروع
        pwd
        ls -la
        
        # البحث عن ملف build.gradle والدخول إلى مجلده
        PROJECT_DIR=$(find . -name "build.gradle" -not -path "*/.*" -exec dirname {} \; | head -n 1)
        echo "Target Project Directory: $PROJECT_DIR"
        
        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: build.gradle not found anywhere in the repository!"
          exit 1
        fi
        
        cd "$PROJECT_DIR"
        
        # التحقق من وجود gradlew أو إنشائه
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        
        # تنفيذ البناء مع إظهار الأخطاء بالكامل
        ./gradlew assembleDebug --no-daemon || {
          echo "=== BUILD FAILED, SHOWING LOGS ==  ="
          cat build/reports/problems/problems.html || true
          exit 1
        }

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        if-no-files-found: error
